<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LocalLLM with Wikipedia</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main>
        <!-- ヘッダーエリア -->
        <header class="header-container">
            <div class="header-text">
                <h1>LocalLLM with Wikipedia</h1>
                <div class="subtitle">ruri-v3-310m + FAISS + Ollama. Local execution only.</div>
            </div>
            <button id="quit" class="quit-button" type="button">Quit</button>
        </header>

        <!-- メイン設定パネル -->
        <section class="panel rag-form">
            <!-- 上段: Question (右端にステータス) -->
            <div class="field-question">
                <div class="question-header">
                    <label for="question">Question</label>
                    <span id="status" class="status"></span>
                </div>
                <textarea id="question" placeholder="Enter prompt..." tabindex="1" autofocus></textarea>
            </div>

            <!-- 下段: Model, Parameters, Ask を同じ段に配置 -->
            <div class="controls-row">
                <div class="field-model">
                    <select id="model">
                        <option value="">Fetching model list...</option>
                    </select>
                </div>

                <div class="actions">
                    <button id="toggleParams" type="button" class="toggle-button">Parameters ⚙️</button>
                    <button id="ask" type="button" tabindex="2">Ask</button>
                </div>
            </div>

            <!-- パラメータ詳細エリア -->
            <div id="paramsContainer" class="params hidden">
                <div>
                    <label for="topk">Top K</label>
                    <input id="topk" type="number" min="1" max="40">
                </div>

                <div>
                    <label for="searchMode">Search mode</label>
                    <select id="searchMode">
                        <option value="auto">auto</option>
                        <option value="legacy_auto">legacy</option>
                        <option value="strict">strict</option>
                        <option value="balanced">balanced</option>
                        <option value="discovery">discovery</option>
                        <option value="article_focus">article focus</option>
                    </select>
                </div>

                <div>
                    <label for="think">Thinking</label>
                    <select id="think">
                        <option value="auto">auto</option>
                        <option value="false">disable</option>
                        <option value="true">enable</option>
                    </select>
                </div>

                <div>
                    <label for="contextChars">Context chars</label>
                    <input id="contextChars" type="number" min="1000" max="100000" step="1000">
                </div>

                <div>
                    <label for="numCtx">num_ctx</label>
                    <input id="numCtx" type="number" min="1024" max="131072" step="1024">
                </div>

                <div>
                    <label for="numPredict">num_predict</label>
                    <input id="numPredict" type="number" min="64" max="32768" step="64">
                </div>

                <div>
                    <label for="temperature">temperature</label>
                    <input id="temperature" type="number" min="0" max="2" step="0.05">
                </div>
            </div>
        </section>

        <!-- 結果表示パネル -->
        <section id="resultPanel" class="panel hidden">
            <h2>Answer</h2>
            <div id="answer" class="answer"></div>
            <div id="metrics" class="metrics"></div>

            <details class="references">
                <summary>Referenced articles</summary>
                <div id="details"></div>
            </details>
        </section>

        <!-- エラー表示パネル -->
        <section id="errorPanel" class="panel hidden">
            <h2>Error</h2>
            <div id="error" class="error"></div>
        </section>
    </main>

    <script src="/static/marked.umd.min.js" defer></script>
    <script src="/static/app.js" defer></script>
</body>
</html>
